<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">MAURON terminal introduction</title>
  <desc id="desc">Animated terminal showing MAURON's role, focus, and services.</desc>
  <defs>
    <linearGradient id="terminalBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.52" stop-color="#243d4a"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="terminalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="1084" height="284" rx="18" fill="#05080d" stroke="#203743" stroke-width="2"/>
  <rect x="8" y="8" width="1084" height="284" rx="18" fill="none" stroke="url(#terminalBorder)" stroke-width="2" stroke-dasharray="125 24">
    <animate attributeName="stroke-dashoffset" from="0" to="-298" dur="8s" repeatCount="indefinite"/>
  </rect>
  <path d="M8 50H1092" stroke="#20313a" stroke-width="2"/>
  <circle cx="34" cy="29" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="29" r="6" fill="#febc2e"/>
  <circle cx="78" cy="29" r="6" fill="#28c840"/>
  <text x="550" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#718b98">mauron-terminal — zsh — 110x24</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">
    <g opacity="0">
      <text x="34" y="88" fill="#00f5d4">mauron@github</text><text x="178" y="88" fill="#8095a1">:</text><text x="188" y="88" fill="#8b5cf6">~</text><text x="202" y="88" fill="#dbe9ef">$ whoami</text>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;.12;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="34" y="120" fill="#dbe9ef">MAURON — Full-Stack Developer &amp; Systems Builder</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.16;.25;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="34" y="160" fill="#00f5d4">mauron@github</text><text x="178" y="160" fill="#8095a1">:</text><text x="188" y="160" fill="#8b5cf6">~</text><text x="202" y="160" fill="#dbe9ef">$ current-focus</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.32;.4;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="34" y="192" fill="#dbe9ef">Pharmacy platforms  •  Price intelligence  •  Automation</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.44;.53;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="34" y="232" fill="#00f5d4">mauron@github</text><text x="178" y="232" fill="#8095a1">:</text><text x="188" y="232" fill="#8b5cf6">~</text><text x="202" y="232" fill="#dbe9ef">$ services --list</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.58;.66;1" dur="8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="34" y="264" fill="#7cff00">Web Development  |  Databases  |  Bots  |  Deployment &amp; Support</text>
      <rect x="815" y="247" width="10" height="22" rx="1" fill="#00f5d4" filter="url(#terminalGlow)">
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
      </rect>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.7;.78;1" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
