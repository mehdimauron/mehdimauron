<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-label="Animated neon divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset=".25" stop-color="#00f5d4"/>
      <stop offset=".5" stop-color="#7cff00"/>
      <stop offset=".75" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M20 28H1180" stroke="#17313a"/>
  <path d="M20 28H1180" stroke="url(#line)" stroke-width="2" stroke-dasharray="160 60" filter="url(#g)">
    <animate attributeName="stroke-dashoffset" from="0" to="-440" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle cx="600" cy="28" r="4" fill="#7cff00" filter="url(#g)"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
