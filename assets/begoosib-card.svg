<svg xmlns="http://www.w3.org/2000/svg" width="570" height="280" viewBox="0 0 570 280" role="img" aria-labelledby="title desc">
  <title id="title">Begoosib project card</title>
  <desc id="desc">Modern online pharmacy commerce experience built with Next.js, React, and TypeScript.</desc>
  <defs>
    <linearGradient id="bsBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13090d"/><stop offset=".55" stop-color="#0a1114"/><stop offset="1" stop-color="#091511"/></linearGradient>
    <linearGradient id="bsLine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff416c"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#36e38d"/></linearGradient>
    <filter id="bsGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="5" y="5" width="560" height="270" rx="22" fill="url(#bsBg)" stroke="#3d202b" stroke-width="2"/>
  <rect x="5" y="5" width="560" height="270" rx="22" fill="none" stroke="url(#bsLine)" stroke-width="2" stroke-dasharray="90 28">
    <animate attributeName="stroke-dashoffset" from="0" to="-236" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(28 25)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect width="46" height="46" rx="14" fill="#2a1018" stroke="#ff416c"/>
    <path d="M14 22h20v15H14zM18 22v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#ff6d8f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M22 29h4M24 27v4" stroke="#36e38d" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="19" font-size="12" fill="#8d7480" letter-spacing="2">FEATURED COMMERCE</text>
    <text x="60" y="44" font-size="25" font-weight="700" fill="#fff0f4">Begoosib</text>
    <circle cx="493" cy="12" r="5" fill="#36e38d"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="506" y="16" font-size="11" fill="#83eeb8">LIVE</text>

    <text x="0" y="92" font-size="14" fill="#d6c5cb">Modern storefront experience for an online</text>
    <text x="0" y="114" font-size="14" fill="#d6c5cb">pharmacy and health-commerce platform.</text>

    <g transform="translate(0 137)" font-size="11">
      <rect width="76" height="28" rx="14" fill="#23131a" stroke="#593142"/><text x="13" y="18" fill="#f3aec0">Next.js</text>
      <rect x="86" width="70" height="28" rx="14" fill="#23131a" stroke="#593142"/><text x="102" y="18" fill="#f3aec0">React</text>
      <rect x="166" width="96" height="28" rx="14" fill="#23131a" stroke="#593142"/><text x="180" y="18" fill="#f3aec0">TypeScript</text>
    </g>

    <g transform="translate(314 114)">
      <rect width="205" height="87" rx="10" fill="#0b1114" stroke="#39232c"/>
      <rect x="12" y="12" width="64" height="63" rx="8" fill="#241018"/>
      <circle cx="44" cy="38" r="15" fill="none" stroke="#ff416c" stroke-width="3"/>
      <path d="M37 38h14M44 31v14" stroke="#36e38d" stroke-width="3" stroke-linecap="round"/>
      <rect x="88" y="14" width="101" height="8" rx="4" fill="#593141"/>
      <rect x="88" y="31" width="78" height="7" rx="3.5" fill="#37252d"/>
      <rect x="88" y="48" width="57" height="18" rx="9" fill="url(#bsLine)" filter="url(#bsGlow)"><animate attributeName="width" values="57;82;57" dur="2.8s" repeatCount="indefinite"/></rect>
    </g>
    <text x="0" y="224" font-size="12" fill="#75616a">UX  •  CATALOG  •  CHECKOUT  •  BRAND SYSTEM</text>
  </g>
